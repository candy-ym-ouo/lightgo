{{define "content"}}
<section class="form-shell"><span class="eyebrow">EDITOR</span><h1>{{if eq .Mode "edit"}}编辑文章{{else}}新建文章{{end}}</h1><p class="notice">保存文章需要先登录。演示账号：admin / secret123</p>
<form id="post-form" data-mode="{{.Mode}}" data-id="{{if .Post}}{{.Post.ID}}{{end}}"><label>标题<input name="title" value="{{if .Post}}{{.Post.Title}}{{end}}" required minlength="3" maxlength="100"></label><label>摘要<textarea name="summary" required maxlength="240">{{if .Post}}{{.Post.Summary}}{{end}}</textarea></label><label>正文<textarea class="content" name="content" required>{{if .Post}}{{.Post.Content}}{{end}}</textarea></label><div class="two"><label>分类<input name="category" value="{{if .Post}}{{.Post.Category}}{{end}}" required></label><label>状态<select name="status"><option value="draft">草稿</option><option value="published" {{if .Post}}{{if eq .Post.Status "published"}}selected{{end}}{{end}}>发布</option></select></label></div><label>标签（逗号分隔）<input name="tags" value="{{if .Post}}{{range $i,$v := .Post.Tags}}{{if $i}}, {{end}}{{$v}}{{end}}{{end}}"></label><button class="button" type="submit">保存文章</button><p id="form-message"></p></form></section>
{{end}}
